name: Import uploaded source

on:
  push:
    branches:
      - main
    paths:
      - 'SOURCE_IMPORT.zip'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Expand source archive
        shell: python
        run: |
          import pathlib
          import zipfile

          root = pathlib.Path.cwd()
          archive = root / "SOURCE_IMPORT.zip"

          if not archive.exists():
              raise SystemExit("SOURCE_IMPORT.zip is missing")

          # 删除旧的包管理器文件，避免 Vercel 再使用 Yarn
          for old_file in [".yarnrc", "yarn.lock"]:
              target = root / old_file
              if target.exists():
                  target.unlink()

          with zipfile.ZipFile(archive) as z:
              files = []

              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")

                  if item.is_dir():
                      continue

                  files.append((item, path))

              # 自动判断 ZIP 是否有最外层文件夹
              first_parts = {
                  path.parts[0]
                  for _, path in files
                  if len(path.parts) > 1
              }

              has_wrapper = (
                  len(first_parts) == 1
                  and all(len(path.parts) > 1 for _, path in files)
              )

              for item, path in files:
                  parts = path.parts[1:] if has_wrapper else path.parts

                  if not parts:
                      continue

                  relative = pathlib.Path(*parts)

                  # 不允许压缩包覆盖 GitHub Actions 本身
                  if relative.parts[:2] == (".github", "workflows"):
                      continue

                  destination = root / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(item))

          # 导入完成后删除 ZIP
          archive.unlink()

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!.github/workflows'

          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Import ONE PTE Trainer v5.1 fixes"
            git push origin HEAD:main
          fi
